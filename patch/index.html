<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Pure's dumb website for dumb things" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--Style sheet and icons-->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
      @keyframes lights {
        0% {
          color: hsl(230, 40%, 80%);
          text-shadow: 0 0 1em hsla(320, 100%, 50%, 0.2), 0 0 0.125em hsla(320, 100%, 60%, 0.3), -1em -0.125em 0.5em hsla(40, 100%, 60%, 0), 1em 0.125em 0.5em hsla(200, 100%, 60%, 0);
        }

        30% {
          color: hsl(230, 80%, 90%);
          text-shadow: 0 0 1em hsla(320, 100%, 50%, 0.5), 0 0 0.125em hsla(320, 100%, 60%, 0.5), -0.5em -0.125em 0.25em hsla(40, 100%, 60%, 0.2), 0.5em 0.125em 0.25em hsla(200, 100%, 60%, 0.4);
        }

        100% {
          color: hsl(230, 40%, 80%);
          text-shadow: 0 0 1em hsla(320, 100%, 50%, 0.2), 0 0 0.125em hsla(320, 100%, 60%, 0.3), 1em -0.125em 0.5em hsla(40, 100%, 60%, 0), -1em 0.125em 0.5em hsla(200, 100%, 60%, 0);
        }
      }

      * {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: hsl(230, 100%, 95%);
        background: linear-gradient(135deg, hsl(233, 43%, 16%), hsl(230, 20%, 7%));
        font: 100% / 1.5 Raleway, sans-serif;
        overflow-x: hidden;
        overflow-y: hidden;
      }

      #gt,
      .download-button {
        animation: lights 5s 750ms linear infinite;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 1.2rem 0;
        color: white;
        font: 100% / 1.5 Raleway, sans-serif;
        text-decoration: none;
        transition: transform 0.3s cubic-bezier(0, -0.73, 0.31, 1.93) 0s;
      }

      .download-button:hover,
      .download-button:focus-visible {
        transform: translateY(-20%);
      }
    </style>
  </head>
  <body>
    <section>
      <div class="container">
        <h1 id="gt" style="font-size: clamp(4rem,8vw,1000rem); font-weight: 300;"><b>Pure's Space</b></h1>
        <a id="gt" style = "font-size: clamp(1.1rem,1.5vw,100rem);"><center>A Hub and a Portfolio</center></a>
        <a class="download-button" href="https://drive.usercontent.google.com/download?id=1noGzQN0u9nqyhr4Fev1Xlj426MXE_VPu&amp;export=download&amp;authuser=0&amp;confirm=t&amp;uuid=e2e06324-0ad0-4f9e-af4f-e103a51e47c4&amp;at=AMrWOn1wpAsZdN1dogTsJClavzbK%3A1790025287684" download rel="noopener">
          <i class="bi bi-download" aria-hidden="true"></i>
          <span>Download</span>
        </a>

        <a id="gt" style = "font-size: clamp(1.1rem,1.5vw,100rem);"><center>I'm Pure, but you already knew that.</center></a>
      </div>
    </section>
    <section id = "socialsContainer">
      <div id = "socialsBar">
        <i class="bi-twitch jiggle" onclick="OpenTwitch()"></i>
        <i class="bi-twitter jiggle" onclick="OpenTwitter()"></i>
        <i class="bi-mailbox jiggle" onclick="OpenMail()"></i>
        <i class="bi-github jiggle" onclick="OpenGithub()"></i>
      </div>
    </section>
    <footer id="gt" style="font-size: clamp(1rem,1.3vh,100px);">
      <center>Creating and Breaking since 2017.</center>
    </footer>
    <div style = "position: absolute; right: 0px; bottom: 0px; font-size: clamp(.5rem,1.3vh,1rem); opacity: 30%; padding-right: 10px;">Made with 🩵 by pure</div>
  </body>
  <!--Javascript-->
    <script src="./assets/site.js"></script>
</html>
